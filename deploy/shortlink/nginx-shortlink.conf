# shortlink.javohir.ru -> shortlink-app:8080
#
# Appended to /srv/hsbch/nginx.conf, which is the single config mounted into
# the shared hsbch-nginx-1 container. Port 80 is already handled by the
# catch-all server block there: it serves the ACME challenge from
# /var/www/certbot and redirects everything else to https.
server {
    listen 443 ssl;
    http2 on;
    server_name shortlink.javohir.ru;

    ssl_certificate     __CERT_DIR__/fullchain.pem;
    ssl_certificate_key __CERT_DIR__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 64k;

    # Resolved at request time through Docker's embedded DNS, so the app
    # container can be rebuilt and replaced without reloading nginx.
    resolver 127.0.0.11 valid=10s;

    access_log /var/log/nginx/shortlink.access.log;
    error_log  /var/log/nginx/shortlink.error.log;

    location / {
        set $upstream_shortlink shortlink-app:8080;
        proxy_pass http://$upstream_shortlink$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
